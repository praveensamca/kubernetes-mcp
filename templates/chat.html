<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>K8s AI Assistant</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f0f;
      color: #ececec;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 24px;
      border-bottom: 1px solid #2a2a2a;
      background: #111;
      flex-shrink: 0;
    }
    header .logo {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, #4f8ef7, #9b5cf6);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }
    header h1 { font-size: 16px; font-weight: 600; }
    header span { font-size: 12px; color: #666; margin-left: auto; }

    /* ── Chat area ── */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px 0;
      scroll-behavior: smooth;
    }

    .message-row {
      display: flex;
      padding: 6px 24px;
      gap: 14px;
      max-width: 820px;
      margin: 0 auto;
      width: 100%;
    }

    .avatar {
      width: 32px; height: 32px; border-radius: 50%;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700;
    }
    .avatar.user  { background: #4f8ef7; color: #fff; }
    .avatar.ai    { background: linear-gradient(135deg, #4f8ef7, #9b5cf6); color: #fff; }

    .bubble {
      flex: 1;
      padding: 10px 0;
      line-height: 1.65;
      font-size: 15px;
      min-width: 0;
    }
    .bubble.user { color: #ececec; }
    .bubble.ai   { color: #d1d5db; }

    /* Markdown inside AI bubble */
    .bubble.ai h1,.bubble.ai h2,.bubble.ai h3 { color: #fff; margin: 14px 0 6px; }
    .bubble.ai p  { margin-bottom: 10px; }
    .bubble.ai ul,.bubble.ai ol { padding-left: 20px; margin-bottom: 10px; }
    .bubble.ai li { margin-bottom: 4px; }
    .bubble.ai code {
      background: #1e1e2e; color: #a5f3fc;
      padding: 2px 6px; border-radius: 4px; font-size: 13px;
    }
    .bubble.ai pre {
      background: #1e1e2e; border-radius: 10px;
      padding: 14px 16px; overflow-x: auto; margin-bottom: 12px;
    }
    .bubble.ai pre code { background: none; padding: 0; color: #a5f3fc; }
    .bubble.ai table {
      border-collapse: collapse; width: 100%; margin-bottom: 12px;
      font-size: 13px;
    }
    .bubble.ai th, .bubble.ai td {
      border: 1px solid #333; padding: 6px 12px; text-align: left;
    }
    .bubble.ai th { background: #1e1e2e; color: #fff; }

    /* Tool badge */
    .tool-badge {
      display: inline-flex; align-items: center; gap: 5px;
      background: #1e2a1e; border: 1px solid #2d4a2d;
      color: #6fcf6f; border-radius: 6px;
      padding: 3px 10px; font-size: 12px; margin-bottom: 10px;
    }
    .tool-badge svg { flex-shrink: 0; }

    /* Typing dots */
    .typing { display: flex; align-items: center; gap: 5px; padding: 6px 0; }
    .typing span {
      width: 7px; height: 7px; border-radius: 50%;
      background: #555; animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: .2s; }
    .typing span:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce {
      0%,80%,100% { transform: translateY(0); }
      40%         { transform: translateY(-6px); }
    }

    /* ── Suggestions ── */
    #suggestions {
      display: flex; flex-wrap: wrap; gap: 8px;
      max-width: 820px; margin: 0 auto 16px;
      padding: 0 24px;
    }
    .suggestion {
      border: 1px solid #2a2a2a; background: #1a1a1a;
      color: #9ca3af; border-radius: 10px;
      padding: 8px 14px; font-size: 13px;
      cursor: pointer; transition: all .15s;
    }
    .suggestion:hover { border-color: #4f8ef7; color: #fff; background: #1e2535; }

    /* ── Input bar ── */
    #input-area {
      border-top: 1px solid #2a2a2a;
      background: #111;
      padding: 16px 24px 20px;
      flex-shrink: 0;
    }
    #input-wrap {
      max-width: 820px; margin: 0 auto;
      display: flex; align-items: flex-end; gap: 10px;
      background: #1a1a1a; border: 1px solid #2a2a2a;
      border-radius: 14px; padding: 10px 12px;
      transition: border-color .2s;
    }
    #input-wrap:focus-within { border-color: #4f8ef7; }
    #user-input {
      flex: 1; background: none; border: none; outline: none;
      color: #ececec; font-size: 15px; resize: none;
      line-height: 1.5; max-height: 160px; overflow-y: auto;
      font-family: inherit;
    }
    #user-input::placeholder { color: #444; }
    #send-btn {
      width: 36px; height: 36px; border-radius: 9px;
      background: #4f8ef7; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: background .15s;
    }
    #send-btn:hover  { background: #3a7de8; }
    #send-btn:disabled { background: #2a2a2a; cursor: default; }
    #send-btn svg { fill: #fff; }

    footer-note {
      display: block; text-align: center;
      font-size: 11px; color: #444; margin-top: 8px;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">⎈</div>
  <h1>K8s AI Assistant</h1>
  <span>Powered by GPT-5.4-mini</span>
</header>

<div id="chat"></div>

<div id="suggestions">
  <div class="suggestion" onclick="sendSuggestion(this)">List all pods</div>
  <div class="suggestion" onclick="sendSuggestion(this)">Show all services</div>
  <div class="suggestion" onclick="sendSuggestion(this)">List ingresses in default namespace</div>
  <div class="suggestion" onclick="sendSuggestion(this)">Create a pod named test-pod using nginx:latest</div>
</div>

<div id="input-area">
  <div id="input-wrap">
    <textarea id="user-input" rows="1" placeholder="Ask about your cluster…"></textarea>
    <button id="send-btn" onclick="sendMessage()">
      <svg width="16" height="16" viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>
  </div>
  <footer-note>AI may make mistakes. Verify critical cluster changes.</footer-note>
</div>

<script>
  const chat      = document.getElementById('chat');
  const input     = document.getElementById('user-input');
  const sendBtn   = document.getElementById('send-btn');
  const suggestEl = document.getElementById('suggestions');

  // Auto-grow textarea
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 160) + 'px';
  });

  // Enter = send, Shift+Enter = newline
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  function sendSuggestion(el) {
    input.value = el.textContent;
    sendMessage();
  }

  function appendMessage(role, html, toolBadges = []) {
    const row = document.createElement('div');
    row.className = 'message-row';

    const avatar = document.createElement('div');
    avatar.className = `avatar ${role}`;
    avatar.textContent = role === 'user' ? 'U' : 'AI';

    const bubble = document.createElement('div');
    bubble.className = `bubble ${role}`;

    if (toolBadges.length) {
      toolBadges.forEach(name => {
        const badge = document.createElement('div');
        badge.className = 'tool-badge';
        badge.innerHTML = `
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
            <path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"/>
          </svg>
          Called <strong>${name}</strong>`;
        bubble.appendChild(badge);
      });
    }

    const content = document.createElement('div');
    content.innerHTML = html;
    bubble.appendChild(content);

    row.appendChild(avatar);
    row.appendChild(bubble);
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
    return bubble;
  }

  function appendTyping() {
    const row = document.createElement('div');
    row.className = 'message-row';
    row.id = 'typing-row';

    const avatar = document.createElement('div');
    avatar.className = 'avatar ai';
    avatar.textContent = 'AI';

    const bubble = document.createElement('div');
    bubble.className = 'bubble ai';
    bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';

    row.appendChild(avatar);
    row.appendChild(bubble);
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
  }

  function removeTyping() {
    const el = document.getElementById('typing-row');
    if (el) el.remove();
  }

  async function sendMessage() {
    const query = input.value.trim();
    if (!query) return;

    // Hide suggestions after first message
    suggestEl.style.display = 'none';

    appendMessage('user', escapeHtml(query));
    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;
    appendTyping();

    try {
      const res = await fetch('/ai/query', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query }),
      });

      const data = await res.json();
      removeTyping();

      if (!res.ok) {
        appendMessage('ai', `<span style="color:#f87171">⚠️ ${escapeHtml(data.detail || 'Unknown error')}</span>`);
        return;
      }

      const toolNames = (data.tools_called || []).map(t =>
        typeof t === 'string' ? t.replace('call_', '') : JSON.stringify(t)
      );

      // Parse tool call_ids to friendly names from answer context
      const toolMatches = (data.answer || '').match(/list_\w+|create_pod/g) || [];
      const badges = [...new Set([...toolMatches])];

      appendMessage('ai', marked.parse(data.answer || 'No response.'), badges);
    } catch (err) {
      removeTyping();
      appendMessage('ai', `<span style="color:#f87171">Request failed: ${escapeHtml(err.message)}</span>`);
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
</script>
</body>
</html>
